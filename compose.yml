services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - proxy-network

  # --- BACKEND (API) ---
  api:
    image: ezemastro/loop-api:latest
    container_name: api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # POSTGRES_USER es el dueño de las tablas y superusuario: la API no lo usa para consultar,
      # solo el runner de migraciones. Las consultas van por DB_APP_USER / DB_UNSCOPED_USER.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGHOST=db
      - API_PORT=3000
      - DB_APP_USER=${DB_APP_USER:-loop_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - DB_UNSCOPED_USER=${DB_UNSCOPED_USER:-loop_app_unscoped}
      - DB_UNSCOPED_PASSWORD=${DB_UNSCOPED_PASSWORD}
      - APP_BASE_URL=${APP_BASE_URL}
    env_file:
      - .env
    volumes:
      - ./uploads:/uploads
    depends_on:
      - db
    networks:
      - proxy-network

  # --- FRONTEND (WEB PRINCIPAL) ---
  web:
    image: ezemastro/loop-web:latest
    container_name: web
    restart: unless-stopped
    networks:
      - proxy-network

  # --- PANEL ADMIN ---
  admin:
    image: ezemastro/loop-admin:latest
    container_name: admin
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - proxy-network

  backup:
    image: prodrigestivill/postgres-backup-local
    container_name: postgres_backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
