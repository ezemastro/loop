services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # Bootstrap del esquema base en un volumen vacío: el entrypoint oficial de postgres corre
      # todo lo que encuentre en /docker-entrypoint-initdb.d/ en orden alfabético, solo la primera
      # vez que arranca con un datadir nuevo. `server/migrations/0000_baseline_reconcile.sql`
      # asume que este esquema base ya existe (ver su propio encabezado) — el servicio `migrate`
      # aplica *migraciones*, no crea el esquema desde cero. Mismo patrón que
      # `e2e/Dockerfile.db-init`, adaptado a bind mount porque este servicio no construye su
      # propia imagen.
      - ./server/database_creation.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ./server/create_categories.sql:/docker-entrypoint-initdb.d/02-categories.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - proxy-network

  # --- MIGRACIONES (one-shot; corre y sale antes de que arranque la API) ---
  migrate:
    image: ezemastro/loop-api:${API_IMAGE_TAG:-1.0.0}
    container_name: migrate
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - MIGRATIONS_DIR=/app/migrations
      - PGHOST=db
      # Credenciales del dueño de las tablas: las migraciones necesitan DDL, que el rol de
      # aplicación deliberadamente no tiene.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # La migración 0007_db_roles_and_rls.sql crea estos roles y falla (RAISE) si las
      # contraseñas vienen vacías.
      - DB_APP_USER=${DB_APP_USER:-loop_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - DB_UNSCOPED_USER=${DB_UNSCOPED_USER:-loop_app_unscoped}
      - DB_UNSCOPED_PASSWORD=${DB_UNSCOPED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy-network

  # --- BACKEND (API) ---
  api:
    image: ezemastro/loop-api:${API_IMAGE_TAG:-1.0.0}
    container_name: api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      # POSTGRES_USER es el dueño de las tablas y superusuario: la API no lo usa para consultar,
      # solo el runner de migraciones. Las consultas van por DB_APP_USER / DB_UNSCOPED_USER.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGHOST=db
      - API_PORT=3000
      - DB_APP_USER=${DB_APP_USER:-loop_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - DB_UNSCOPED_USER=${DB_UNSCOPED_USER:-loop_app_unscoped}
      - DB_UNSCOPED_PASSWORD=${DB_UNSCOPED_PASSWORD}
      - APP_BASE_URL=${APP_BASE_URL}
      # sec-hardening-api (task 7.8, hand-off): declarados acá explícitamente para que el
      # requisito quede visible en la infraestructura, no solo en env.ts. Sin `=` a propósito
      # (mismo patrón que docker-compose.dev.yml): si la variable no está definida donde corre
      # `docker compose` (shell o el `.env` de la raíz que Compose ya lee para interpolación), la
      # clave queda sin declarar en el contenedor en vez de mandarse como string vacío. Un string
      # vacío rompería `env.ts` incondicionalmente al arrancar (`z.string().min(1)`/
      # `z.coerce.number()` no aplican su default ante `""`, solo ante `undefined`) — con la clave
      # ausente, en cambio, `env.ts` decide: fuera de producción cae a su default seguro, y en
      # producción la validación estricta aborta con un mensaje claro si el secreto realmente
      # falta, en vez de un crash de coerción.
      - ADMIN_JWT_SECRET
      - ADMIN_PASS_TOKEN
      - TOKEN_EXP
      - ADMIN_TOKEN_EXP
      - RATE_LIMIT_ENABLED
    env_file:
      - .env
    volumes:
      - ./uploads:/uploads
    # runtime-observability (INF-10): a diferencia de /status (liveness, no toca la base),
    # /health hace un SELECT real y reporta si la base y RLS están arriba. Mismo patrón que
    # docker-compose.e2e.yml:94-104, apuntado al endpoint real de dependencias.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy-network

  # --- FRONTEND (WEB PRINCIPAL) ---
  web:
    image: ezemastro/loop-web:${WEB_IMAGE_TAG:-1.2.0}
    container_name: web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-network

  # --- PANEL ADMIN ---
  admin:
    image: ezemastro/loop-admin:${ADMIN_IMAGE_TAG:-0.3.0}
    container_name: admin
    restart: unless-stopped
    ports:
      - "3002:80"
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy-network

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: postgres_backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
