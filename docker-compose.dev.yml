# Compose de desarrollo para todos los módulos: db, api, web (Expo) y admin (Vite)
# Uso: npm run dev (resuelve DEV_HOST con la IP de LAN del host y levanta este compose).
# DEV_HOST es el host que los clientes usan para llegar a la API: si queda en `localhost`, un
# celular u otra notebook lo resuelven contra sí mismos y no alcanzan nada.
# OJO: el daemon Docker es externo (docker-outside-of-docker): los bind mounts del host no funcionan,
# por eso el código viaja dentro de las imágenes y los cambios se sincronizan con `watch` (sync).
services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:16
    container_name: loop-dev-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Fuente única: el .env de la raíz. `./server/.env` queda como puente opcional mientras se
    # termina de migrar; va primero para que la raíz gane. Cuando ese archivo ya no exista,
    # se puede borrar la primera entrada sin tocar nada más.
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- BACKEND (API) ---
  api:
    build:
      context: .
      dockerfile: ./Dockerfile.api
      target: development
    container_name: loop-dev-api
    ports:
      # API_PORT publishes the host-side port only; the container always listens on PORT (default 3000, see env.ts). Setting API_PORT alone does not move the in-container port.
      - "${API_PORT:-3000}:3000"
    # Ver la nota de `db`: la raíz gana, `./server/.env` es el puente opcional de la migración.
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - NODE_ENV=development
      # POSTGRES_USER es el dueño de las tablas y superusuario: la API no lo usa para consultar,
      # solo el runner de migraciones. Las consultas van por DB_APP_USER / DB_UNSCOPED_USER.
      - PGHOST=db
      - DB_APP_USER=${DB_APP_USER:-loop_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD:-}
      - DB_UNSCOPED_USER=${DB_UNSCOPED_USER:-loop_app_unscoped}
      - DB_UNSCOPED_PASSWORD=${DB_UNSCOPED_PASSWORD:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://${DEV_HOST:-localhost}:${WEB_PORT:-8081}}
      # URL pública del api: la usa el link de verificación de email (BASE_URL)
      - BASE_URL=${BASE_URL:-http://${DEV_HOST:-localhost}:3000}
      # sec-hardening-api (task 7.8, hand-off). Sin `=`, como EXPO_PUBLIC_WEB_GOOGLE_CLIENT_ID
      # arriba: si no están en el `.env` de la raíz, no se definen en el contenedor y env.ts cae a
      # sus propios defaults de desarrollo (sentinels para los secretos, 30 días/30 minutos para
      # los TTL, "true" para RATE_LIMIT_ENABLED) en vez de recibir un string vacío.
      - ADMIN_JWT_SECRET
      - ADMIN_PASS_TOKEN
      - TOKEN_EXP
      - ADMIN_TOKEN_EXP
      - RATE_LIMIT_ENABLED
    volumes:
      - /app/server/api/node_modules
      - ./server/uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./server/api/src
          target: /app/server/api/src
          ignore:
            - node_modules/
        - action: sync
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./server/api/package.json

  # --- FRONTEND WEB (Expo / React Native) ---
  web:
    build:
      context: .
      dockerfile: ./Dockerfile.web.dev
    container_name: loop-dev-web
    ports:
      - "${WEB_PORT:-8081}:8081"
    environment:
      # Sin esto Expo lee client/.env y arma `expo/virtual/env` con ESE archivo, ignorando el
      # entorno del contenedor: la app termina llamando a la URL del archivo aunque acá diga otra.
      - EXPO_NO_DOTENV=1
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://${DEV_HOST:-localhost}:3000}
      # Sin `=`: si la variable no está en el .env de la raíz, no se define en el contenedor
      # (en vez de definirse vacía, que es lo que rompía el login de Google).
      - EXPO_PUBLIC_WEB_GOOGLE_CLIENT_ID
      - EXPO_PUBLIC_REPORT_EMAIL
      - EXPO_PUBLIC_INSTITUTIONAL_EMAIL_FORM_URL
      - EXPO_NO_TELEMETRY=1
    volumes:
      - /app/client/node_modules
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
          ignore:
            - node_modules/
            - .expo/
            - dist/
            - .git/
            # El env del cliente sale del .env de la raíz vía Compose; si se sincroniza el archivo
            # local, Expo vuelve a leerlo y pisa la URL de la API.
            - .env
            - .env.*
        # El dataset demo vive fuera de client/ y el bundle lo importa: se sincroniza igual.
        - action: sync
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./client/package.json

  # --- PANEL ADMIN (Vite) ---
  admin:
    build:
      context: .
      dockerfile: ./Dockerfile.admin.dev
    container_name: loop-dev-admin
    ports:
      - "${ADMIN_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://${DEV_HOST:-localhost}:3000}
      - VITE_GOOGLE_CLIENT_ID
    volumes:
      - /app/adminClient/node_modules
    develop:
      watch:
        - action: sync
          path: ./adminClient
          target: /app/adminClient
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: rebuild
          path: ./adminClient/package.json

volumes:
  postgres-data:
